<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Race Calc Pro</title>
<link rel="stylesheet" href="style.css">
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body>
<div class="container">
<h1>Race Calc Pro</h1>
<div class="top">
<div class="card">
<label>FTP (Watts)</label>
<input type="number" id="ftp">
<div class="collapsible">What is FTP? ⬇</div>
<div class="content">
<p>FTP = max 1-hour power. Use ~95% of 20-min effort.</p>
</div>
<label>Target IF</label>
<input type="number" id="targetIF" value="0.85" step="0.01">
<div class="collapsible">What is IF? ⬇</div>
<div class="content">
<p>IF = effort vs FTP. 0.85 = 85% FTP.</p>
</div>
<label>Crr</label>
<input type="number" id="crr" value="0.005" step="0.001">
<div class="collapsible">What is Crr? ⬇</div>
<div class="content">
<p>Rolling resistance. Gravel ≈ 0.008–0.01</p>
</div>
<div style="border-top:1px solid #e5e7eb;margin-top:16px;padding-top:12px">
<p style="font-size:13px;color:#6b7280;margin:0 0 8px">&#x1F4A8; My Wind Sock</p>
<button type="button" onclick="fetchWind()" style="background:#0ea5e9;margin-bottom:8px">&#x1F4E1; Auto-fetch wind from GPX</button>
<div id="windStatus" style="font-size:12px;color:#6b7280;margin-bottom:6px"></div>
<label>Wind speed (km/h)</label>
<input type="number" id="windSpeed" placeholder="e.g. 20" step="1" min="0">
<label>Wind direction</label>
<select id="windDir" style="width:100%;padding:6px;margin-top:4px;border:1px solid #ccc;border-radius:4px">
    <option value="headwind">Headwind (into you)</option>
    <option value="tailwind">Tailwind (behind you)</option>
    <option value="crosswind">Crosswind (side)</option>
</select>
</div>

<label>Upload GPX</label>
<input type="file" id="gpxFile">

<div style="border-top:1px solid #e5e7eb;margin-top:16px;padding-top:12px">
<p style="font-size:13px;color:#6b7280;margin:0 0 8px">&#x1F4C5; Previous year's race (optional)</p>
<label>Finish time (e.g. 3:45)</label>
<input type="text" id="prevTime" placeholder="h:mm or hh:mm">
<label>Avg speed (km/h)</label>
<input type="number" id="prevSpeed" placeholder="e.g. 28.5" step="0.1">
</div>

<button onclick="runCalc()">Generate Plan</button>
</div>
<div class="card">
<canvas id="chart"></canvas>
</div>
</div>
<div class="card">
<h3>Segments</h3>
<div id="segments"></div>
</div>
</div>
<script src="app.js"></script>
</body>
</html>
